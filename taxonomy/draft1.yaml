        name: Race & racial justice
        description: Racism, racial justice cases and civil rights.
      - id: lgbtq
        name: LGBTQ+ life & rights
        description: Queer and trans life, identity, community and rights.
      - id: gender_feminism
        name: Gender & feminism
        description: Feminism, women's rights, sexism and gender commentary.
      - id: policing_justice
        name: Policing & criminal justice
        description: Police misconduct, prisons, executions and the justice system.
      - id: crime_news
        name: Crime news
        description: Reports of crimes, arrests, charges and trials.
      - id: labor_inequality
        name: Labor & inequality
        description: Unions, workers' rights, billionaires, corporate greed, poverty and wealth inequality.
      - id: education_schools
        name: Education & schools policy
        description: School funding, book bans, school boards and curriculum disputes.
      - id: urban_transit
        name: Cities & transit issues
        description: Public transit policy, urbanism, housing and infrastructure. Not automated delay alerts (see automated_feeds).
      - id: social_commentary
        name: Social commentary
        description: General opinions and observations about society and human behavior.
      - id: other
        name: Other social issues
        description: Social-issue content that fits no other subtopic.
