# DRAFT taxonomy, generated by tools/draft_taxonomy.py with claude-opus-5-5:api
# from 5772 posts sampled across all hours of the day. Needs human review (plan §8.2).
version: draft1
broad:
  - id: us_politics
    name: US Politics
    description: US domestic politics, government, elections, courts and political commentary. Not US wars or diplomacy abroad (see world_news). Not social-justice issues without a political focus (see society).
    examples:
      - "Trump’s Approval Sinks to 37% via @politicalwire.com"
      - "ATTENTION TEXAS RESIDENTS: October 5th is the last day to register to vote."
      - "Legislation introduced to stop ICE detention warehouses once and for all"
    subtopics:
      - id: trump_administration
        name: Trump & the administration
        description: News, criticism and commentary on Trump, his cabinet, officials and executive actions. Not foreign policy (see world_news).
      - id: elections
        name: Elections & campaigns
        description: Midterms, candidates, polls, voter registration, redistricting and get-out-the-vote posts.
      - id: courts_legal
        name: Supreme Court & courts
        description: Supreme Court and federal court rulings, justices, lawsuits against the government.
      - id: immigration
        name: Immigration & ICE
        description: ICE raids, deportations, detention centers and immigration policy.
      - id: congress
        name: Congress & corruption
        description: Congressional votes, legislation, and corruption or ethics scandals involving officials.
      - id: press_freedom
        name: Press freedom
        description: White House press bans, FCC threats, media access and government censorship of journalists.
      - id: epstein
        name: Epstein files
        description: Epstein files releases, lawsuits and related scandals.
      - id: state_local
        name: State & local politics
        description: US state legislatures, governors, mayors, city councils and local elections.
      - id: economic_policy
        name: Economic & labor policy
        description: Government shutdowns, federal budgets, tariffs, housing and labor policy as political issues.
      - id: activism
        name: Activism & petitions
        description: Petitions, letters to Congress, protests and political organizing calls.
      - id: other
        name: Other US politics
        description: US political content that fits no other subtopic.
  - id: world_news
    name: World News & Geopolitics
    description: International affairs, wars, diplomacy, and politics of countries other than the US, including US foreign policy and wars. Not US domestic politics (see us_politics).
    examples:
      - "Russia struck yet another apartment building in Kyiv. This is terrorism!"
      - "Iran proposes a 7-day plan to reopen the Strait of Hormuz"
      - "Manila blames Chinese aggression for aborted South China Sea mission"
    subtopics:
      - id: israel_palestine
        name: Israel, Gaza & Palestine
        description: Israel, Gaza, West Bank, Netanyahu, and related protests.
      - id: russia_ukraine
        name: Russia-Ukraine war
        description: The war, strikes, aid to Ukraine, Putin, Zelensky, NATO tensions.
      - id: iran_middle_east
        name: Iran & Middle East
        description: US-Iran war, Strait of Hormuz, Yemen and other Middle East conflicts.
      - id: china_asia_pacific
        name: China & Asia-Pacific
        description: US-China relations, Trump-Xi summit, Taiwan, South China Sea, other Asian politics.
      - id: canada
        name: Canada
        description: Canadian federal and provincial politics, US-Canada relations.
      - id: uk_ireland
        name: UK & Ireland
        description: UK and Irish politics, Reform UK, Labour, Brexit, Irish unification.
      - id: europe
        name: Europe
        description: EU and continental European politics.
      - id: australia_nz
        name: Australia & New Zealand
        description: Australian and New Zealand politics.
      - id: africa_latin_america
        name: Africa & Latin America
        description: News and politics from Africa, Latin America and the Caribbean.
      - id: international_institutions
        name: UN & international bodies
        description: UN, ICC, human rights councils and multilateral diplomacy.
      - id: other
        name: Other world news
        description: International news that fits no other subtopic.
  - id: society
    name: Society & Social Issues
    description: Civil rights, identity, justice, crime and social commentary. Not partisan US electoral politics (see us_politics). Not personal emotional posts (see personal_life).
    examples:
      - "Racism will make people believe and say some truly insane bullshit."
      - "Things I like to see in my neighbourhood. 🏳️‍🌈 💜🏳️‍⚧️"
      - "HUGE: Autozone workers just won the first ever union at the company."
    subtopics:
