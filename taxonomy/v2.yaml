  - id: unclear
    name: Unclear
    description: "No discernible topic, or not enough content to tell. Includes bare links, emoji-only or one-word reactions, replies that only make sense inside a conversation we cannot see, random code strings such as 'macro: …', and untranslatable fragments. Not a clear joke (see humor). Not a clear remark about the author's own day or state (see personal_life)."
    examples:
      - "Interesting."
      - "macro: K1xgKVt3uFFRNwideNzj"
      - "Monday"
