      - id: comics
        name: Comics
        description: "Comic books, superheroes in print, webcomics, and comic strips."
      - id: commissions
        name: Commissions
        description: "Open commissions, YCHs, adoptables, art trades, and finished commission posts."
      - id: fine_art
        name: Fine art & painting
        description: "Paintings, traditional media, sculpture, art history, and museum pieces."
      - id: other
        name: Other art
        description: "Crafts such as knitting and quilting, cosplay, AI or generative art, and art that fits no other subtopic."
  - id: society
    name: Society & social issues
    description: "Social issues, identity, class, crime, and community life discussed outside partisan politics, such as general posts on billionaires, capitalism, or injustice that name no politician, party, or law. Posts about politicians, parties, legislation, or elections go to us_politics or world_news, even when the issue is social. A personal story goes to personal_life unless its point is the social issue."
    examples:
      - "Know what's even worse than religion and nationalism? Religious nationalism."
      - "Two Dead Following North Las Vegas Shooting"
      - "#HelpSky #FundSky #MutualAid #HelpFolksLive"
    subtopics:
      - id: social_commentary
        name: Social commentary
        description: "Opinions on culture, class, inequality, labor, and how society works."
      - id: racial_justice
        name: Race & racism
        description: "Racism, racial justice, and Black experiences."
      - id: gender_lgbtq
        name: Gender & LGBTQ+
        description: "Feminism, misogyny, trans rights, and queer identity and experiences."
      - id: crime_justice
        name: Crime & policing
        description: "Crime news, shootings, sexual assault cases, policing, prisons, and executions."
      - id: community_aid
        name: Mutual aid & community
