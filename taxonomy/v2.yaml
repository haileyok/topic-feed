        name: Horny & thirst posts
        description: "Text posts about being horny, sexual desire, and suggestive selfies without explicit content."
      - id: kink_fetish
        name: Kink & fetish
        description: "BDSM, chastity, ABDL, findom, hypnosis, fetish content, and domme services."
      - id: nsfw_art
