# Taxonomy v2: v1 with the broad-topic descriptions of us_politics, world_news, personal_life,
# humor, society, online_culture and unclear reworded to settle the boundaries where Jev and
# Clef-flash disagreed most on 6,322 text-only posts (2026-10-02). Every topic and subtopic ID,
# name and subtopic description is unchanged. The reasons for each wording choice are in
# docs/taxonomy-v2.md.
# v1 was drafted by tools/draft_taxonomy.py with claude-opus-5-5:api from 8654 posts sampled
# evenly over 74 hours (2026-09-25 07:06 to 2026-09-28 08:24 UTC), with a 100-120 subtopic
# budget, sized using measured volumes from draft1:9f5ae0c146e0, and approved by Hailey on
# 2026-09-28.
version: v2
broad:
  - id: us_politics
    name: US politics
    description: "US government, politicians, parties, elections, and policy, including partisan posts that name a US politician, party, or law, and US scandals whoever is involved. Politics with no country given defaults here. Not other countries' politics (see world_news). Not social, class, or ideology commentary that names no politician, party, or law (see society)."
    examples:
      - "Vote straight Democrat. [quote: Everyone MUST vote!]"
      - "White House blocks CNN from Air Force One in latest escalation with media - The Guardian"
      - "Trump’s MAGA Support Is Evaporating Even In Red States"
    subtopics:
      - id: trump_administration
        name: Trump administration
        description: "Trump, his cabinet, White House actions, and criticism or support of them. Not immigration enforcement (see immigration)."
      - id: elections
        name: Elections & campaigns
        description: "US elections, midterms, candidates, polls, voter registration, voting rights, and campaign fundraising."
      - id: congress
        name: Congress
        description: "House and Senate votes, legislation, and members of Congress acting in their legislative role."
      - id: courts_legal
        name: Courts, DOJ & investigations
        description: "Supreme Court and federal court rulings, DOJ, prosecutions, and political scandals or investigations, such as the Epstein files."
      - id: state_local
        name: State & local politics
        description: "US governors, state legislatures, mayors, city councils, and local ballot measures."
      - id: immigration
        name: Immigration & ICE
        description: "US immigration policy, ICE raids, detention, deportations, and related protests."
      - id: press_freedom
        name: Press & media
        description: "US news media coverage, press access, journalists, and media criticism."
      - id: economic_policy
        name: Economic policy
        description: "US taxes, tariffs, budgets, spending cuts, Social Security, and government economic decisions."
      - id: other
        name: Other US politics
        description: "US political content that fits no other subtopic, such as party strategy, activism, or petitions."
  - id: world_news
    name: World news & politics
    description: "News, politics, and conflicts of other countries, in any language, including foreign wars and diplomacy the US takes part in. Judge by whose politics the post is about, not whose people it mentions. Not US domestic politics, including the US argument over a foreign war (see us_politics)."
    examples:
      - "Netanyahu speech sparks mass walkout at U.N. - YouTube"
      - "Putin is testing NATO on Norway’s remote Arctic islands – POLITICO"
    subtopics:
      - id: israel_palestine
        name: Israel & Palestine
        description: "Gaza, the West Bank, Israel, and pro-Palestine protests and boycotts anywhere."
      - id: russia_ukraine
        name: Russia & Ukraine
        description: "The Russia-Ukraine war, strikes, NATO responses, and diplomacy."
      - id: iran_middle_east
        name: Iran & Middle East
        description: "The Iran war, Strait of Hormuz, Lebanon, Syria, Yemen, and Gulf states. Not Israel-Palestine."
      - id: uk_ireland
        name: UK & Ireland
        description: "UK and Irish politics, including Labour, Reform, the Tories, Northern Ireland, and UK protests."
      - id: europe
        name: Europe
        description: "Politics and news in continental European countries and the EU."
      - id: china_asia_pacific
        name: China & Asia-Pacific
        description: "China, US-China relations, East, South, and Southeast Asia, Australia, and New Zealand."
      - id: other
        name: Other world news
        description: "Canada, Latin America, Africa, the UN, and world news that fits no other subtopic."
  - id: personal_life
    name: Personal life
    description: "Sincere posts about the author's own life with no other clear topic, such as life updates, feelings, greetings, and routines. Posts about a specific hobby or topic go to that topic. A joke or relatable quip about one's own life goes to humor. A reaction too short to tell what it is about goes to unclear."
    examples:
      - "one week married 🥰"
      - "Good morning everyone 🌞"
      - "I got my bicycle back guys"
    subtopics:
      - id: daily_updates
        name: Daily updates
        description: "What happened today, errands, routines, sleep, and small life news."
      - id: feelings
        name: Feelings & venting
        description: "Moods, emotional venting, loneliness, grief, and despair, stated without medical framing. Diagnoses and treatment go to health/mental_health."
      - id: relationships_family
        name: Relationships, dating & family
        description: "Partners, crushes, dating, marriage, kids, parents, and friendships."
      - id: greetings
        name: Greetings
        description: "Good morning or good night posts and general well-wishes to followers. Not @-mention shoutouts (see online_culture)."
      - id: other
        name: Other personal life
        description: "Personal content that fits no other subtopic."
  - id: entertainment
    name: TV, film & celebrities
    description: "TV, movies, anime, podcasts, theater, and celebrities. Not comics (see art). Not music (see music). Not screencap or frame bots (see automated_feeds)."
    examples:
      - "Now seated for Silence of the Lambs on 35mm"
      - "Everyone is saying Drew will win pt 2….. #BB28"
    subtopics:
      - id: tv_shows
        name: TV shows
        description: "TV series, streaming shows, reality TV such as Big Brother and Bake Off, and best-TV lists."
      - id: movies
        name: Movies
        description: "Films, reviews, Letterboxd logs, cinemas, trailers, and franchise news."
      - id: anime_manga
        name: Anime & manga
        description: "Anime series and films, manga chapters, and anime fandom discussion."
      - id: celebrities
        name: Celebrities & awards
        description: "Celebrity news, deaths of entertainers, red carpets, and award shows such as the VMAs."
      - id: other
        name: Other entertainment
        description: "Podcasts, theater, audio drama, and entertainment content that fits no other subtopic."
  - id: gaming
    name: Gaming
    description: "Video games, tabletop and card games, game streaming, and daily puzzle games. Not game-deal ads (see promotion)."
    examples:
      - "I love every part of No Man's Sky until I'm forced to get out of my ship."
      - "Connections Puzzle #1204 🟩🟩🟩🟩 🟦🟦🟦🟦 🟨🟨🟨🟨 🟪🟪🟪🟪"
    subtopics:
      - id: video_games
        name: Video games
        description: "Playing, reviewing, and discussing video games, plus game industry news and indie game development."
      - id: streaming_vtubers
        name: Streaming & VTubers
        description: "Twitch or YouTube go-live posts, stream schedules, and VTubers."
      - id: daily_puzzles
        name: Daily puzzles
        description: "Shared results from Wordle, Connections, Strands, MapTap, chess puzzles, and similar daily games."
      - id: tabletop_games
        name: Tabletop & card games
        description: "D&D and other TTRPGs, board games, Magic and Pokémon TCG, Warhammer, and miniatures."
      - id: other
        name: Other gaming
        description: "Gaming content that fits no other subtopic."
  - id: automated_feeds
    name: Automated feeds
    description: "Posts generated by bots, such as alerts, trackers, and now-playing feeds. Not human posts about the same subjects."
    examples:
      - "🚄🟦 Amtrak: Amtrak train #A98 to Discharge Only is up to 150 minutes late."
      - "Now playing on KB Radio: Lay, Lady, Lay by Bob Dylan!"
    subtopics:
      - id: weather_alerts
        name: Weather & hazard alerts
        description: "Automated weather warnings, station readings, climate reports, air quality, and earthquake alerts."
      - id: radio_now_playing
        name: Radio now playing
        description: "Automated radio and playlist now-playing posts."
      - id: transit_traffic
        name: Transit & traffic
        description: "Automated train or bus delays, roadworks, fuel prices, bike-share stats, and flight or aircraft tracking."
      - id: market_bots
        name: Market bots
        description: "Automated crypto, stock, trading, and price-alert posts."
      - id: other
        name: Other bots
        description: "Other bots, such as clock chimes, TV frame or screencap bots, on-this-day episode bots, security and CVE alerts, outages, and dispatch calls."
  - id: humor
    name: Humor
    description: "Posts whose main purpose is to be funny, such as jokes, one-liners, memes, and absurd or relatable observations, including jokes about the author's own life. Humor about a specific topic still goes here unless it is mainly commentary on that topic. A bare 'lol' or emoji reaction is unclear."
    examples:
      - "What kind of motorcycle do dolls ride? Kawawasaki"
      - "Asking Jeeves: Is Connecticut a real place?"
    subtopics:
      - id: jokes_puns
        name: Jokes & puns
        description: "Structured jokes, puns, wordplay, and joke-format games."
      - id: shitposts
        name: Shitposts & memes
        description: "Absurd one-liners, surreal posts, memes, and reaction-image humor."
      - id: funny_stories
        name: Funny stories
        description: "Humorous personal anecdotes and observations."
      - id: other
        name: Other humor
        description: "Humor that fits no other subtopic, such as parody or satire."
  - id: sports
    name: Sports
