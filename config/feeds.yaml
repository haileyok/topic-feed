# Topic feeds served by cmd/feedgen.
#
# THE TOPIC FEEDS IN THIS FILE ARE ONLY A STARTING POINT. The feeds served are kept in the database
# (schema/014_user_feeds.sql) and are made and changed on the web (the page at /feeds, and the builder at
# /): the first time feedgen starts with that table, the feeds below are copied into it under the
# owner's account, and from then on this file's topic feeds are not looked at. Editing one here changes
# nothing; a feed taken down on the web is not brought back by a restart. What is still read from this
# file: the `personal:` feed (made from each viewer's likes), and the layout of every feed's fields,
# documented below. See docs/web-feeds.md.
#
# `make feeds-publish` still writes the owner's feeds (those in the database) to the owner's account.
#
#   rkey          record key: the last part of the feed's at:// URI (max 15 characters;
#                 changing it makes a new feed and orphans the old one)
#   display_name  shown in Bluesky (max 24 characters)
#   description   shown in Bluesky (max 300 characters)
#   paths         taxonomy subtopic paths (sports/american_football) or whole broad
#                 topics (world_news), from taxonomy/v2.1.yaml; a post matches when its
#                 probability for any of them is at least min_prob (for a broad topic:
#                 the broad-topic probability, which covers all its subtopics)
#   exclude       optional; leave out posts whose probability for a broad topic or
#                 subtopic is above a value, e.g. {adult_content: 0.2, art/commissions: 0.3}
#   min_prob      0-1; higher is stricter
#   allow_adult   also show posts the label policy marks adult_only (default false)
#   ranking       optional; any field left out keeps the default below
#   accepts_interactions
#                 ask Bluesky to send interactions with the feed's posts (seen, like,
#                 show more/less, ...) to table feed_interactions (default true;
#                 takes effect after `make feeds-publish`)
#   max_posts     candidates kept, newest first (default FEEDGEN_MAX_POSTS, 3000); busy
#                 topics need more to reach back as far: 3000 is ~3.5h of video games
#   tone          optional; filter or nudge posts by the model's tone probabilities
#                 (0-1, summing to 1): informative, humorous, personal, outraged,
#                 supportive, other
#
#                   tone:
#                     max: {outraged: 0.5}      # hard cutoff: drop posts above this
#                     min: {humorous: 0.5}      # hard cutoff: drop posts below this
#                     weights: {outraged: -2, supportive: 1}
#                                               # nudge: weight * probability is added
#                                               # to the ranking prior; nothing removed
#
#   personal      makes the feed a different one for each viewer, built from the posts they
#                 liked and reposted; paths, min_prob and exclude then don't apply (use
#                 `personal: {}` for the defaults). A viewer's interests are the subtopics of
#                 what they liked, newer likes counting more; the feed gives each interest
#                 slots in proportion to its share, taking the best-ranked recent posts of
#                 that subtopic (`ranking` below orders them), and leaves out posts the viewer
#                 already liked, wrote, or has seen. Settings (defaults in brackets):
#
#                   personal:
#                     lookback_days: 30     # how far back likes count (the likes table keeps 14)
#                     half_life_days: 7     # a like's weight halves every this many days
#                     min_likes: 5          # classified liked posts needed; fewer: a mix of every topic
#                     topics: 20            # interests used, strongest first
#                     window_hours: 24      # only posts at most this old
#                     per_topic: 200        # newest posts kept per subtopic
#                     top_per_topic: 150    # more kept per subtopic: the most engaged for their age,
#                                           # from the whole window (a busy subtopic's newest 200
#                                           # are only minutes old; these reach back hours)
#                     min_engagement: 5     # likes' worth of reactions a post needs before it is shown
#                                           # (a repost or reply counts as 2 likes, a quote as 3, per
#                                           # `ranking`). Posts below it are left out even when nothing
#                                           # else is left, so a feed that runs out of well-liked posts
#                                           # gets shorter instead of filling up with new ones nobody
#                                           # has reacted to yet (0: no minimum)
#                     min_topic_prob: 0.5   # a post belongs to its top subtopic at this probability
#                     max_serves: 2         # times a post may be sent before it counts as seen
#                                           # even if Bluesky never reports a view (1: never repeats)
#                     list_size: 300        # posts in a viewer's feed at a time
#                     author_gap: 10        # slots between one author's posts (0: no limit)
#
#                 Viewers' likes are read the first time they open the feed (about a second);
#                 until then, and for anyone not signed in, the feed shows the post named by
#                 FEEDGEN_WELCOME_POST (`make feeds-welcome` creates it). Needs
#                 schema/009_viewer_served.sql (`make schema`).
#
# Ranking (internal/feedgen/config.go, DefaultRanking). Each post scores
#
#   (prior + like*likes + repost*reposts + reply*replies + quote*quotes) / (age_hours + 2)^gravity
#
# with prior = max(0.1, 1 + substance + general_interest - promo_penalty*promo) from the
# model's signals, so posts with no engagement yet are still ordered sensibly. Every
# fresh_every-th slot goes to the newest post not already placed, and an author's posts
# are kept author_gap slots apart. Defaults:
#
#   ranking:
#     weights: {like: 1, repost: 2, reply: 2, quote: 3}
#     gravity: 1.8        # higher: older posts sink faster
#     fresh_every: 4      # 0: no fresh slots
#     author_gap: 10      # 0: no limit
#     promo_penalty: 1    # 0: promotional posts aren't penalized
#
# Feeds cover the last FEEDGEN_WINDOW_HOURS (24). Thresholds were
# picked from the first hour of live predictions (2026-09-29): at 0.5, NFL matched ~40
# posts/hour on a Monday night; at 0.6, AI matched ~90/hour.

feeds:
  - rkey: nfl
    display_name: "NFL on Bluesky"
    description: "Keep up with the NFL on Bluesky"
    paths: [sports/american_football]
    min_prob: 0.5
    exclude: {us_politics: 0.15, world_news: 0.15, adult_content: 0.2}
    ranking:
      gravity: 2.6
      fresh_every: 7
      author_gap: 3

  - rkey: mlb   # "baseball" is taken by the peruse Baseball Feed on hailey.at
    display_name: Baseball
    description: Posts about baseball (MLB, the playoffs, and the rest of the game), picked by a topic classifier. No keyword lists.
    # Same settings as NFL (Hailey, 2026-09-29): only clear baseball posts, no politics.
    paths: [sports/baseball]
    min_prob: 0.85
    exclude: {world_news: 0.15, us_politics: 0.15, adult_content: 0.2}
    # Ranking tuned by Hailey in the feed builder (2026-09-29): strongly favors what's
    # new (gravity 3), a brand-new post every 3rd slot, authors 3 slots apart.
    ranking:
      gravity: 3
      fresh_every: 3
      author_gap: 3
      promo_penalty: 3.5
    max_posts: 10000   # ~2,800 posts in 48 hours at 0.85 during the playoffs

  # Tuned in the feed builder (2026-10-01); keeps the original `ai` rkey so the
  # published feed isn't orphaned.
  - rkey: ai
    display_name: "AI remix"
    description: "AI remix, picked by a topic classifier. No keyword lists."
    paths: [technology/ai]
    min_prob: 0.3
    exclude: {adult_content: 0.2}
    tone:
      max: {humorous: 0.45}
    signals:
      max: {critical: 0.15, spam: 0.05}
    ranking:
      gravity: 2
      fresh_every: 0
      author_gap: 0
      weights: {like: 3.5}

  - rkey: video-games
    display_name: Video Games
    description: Posts about video games (playing, reviews, news, and indie development), picked by a topic classifier. No keyword lists.
    paths: [gaming/video_games]
    min_prob: 0.5
    max_posts: 10000   # ~800 posts/hour at 0.5 (2026-09-29): about 12 hours of candidates

  # Tuned by Hailey in the feed builder (2026-09-30): only upbeat, non-joke pet posts,
  # strongly favoring what's new, no fresh slots.
  - rkey: pets
    display_name: "Pets!"
    description: "Pets!, picked by a topic classifier. No keyword lists."
    paths: [animals_nature/cats, animals_nature/dogs, animals_nature/other_pets]
    min_prob: 0.5   # posts at 0.5-0.6 were real pets (2026-09-29)
    exclude: {adult_content: 0.2}
    tone:
      max: {humorous: 0.4}
    signals:
      min: {sentiment: 0.8}
    ranking:
      gravity: 2.5
      fresh_every: 0

  - rkey: anime
    display_name: Anime & Manga
    description: Posts about anime and manga, picked by a topic classifier. No keyword lists.
    paths: [entertainment/anime_manga]
    min_prob: 0.65  # at 0.5-0.6 about half were K-pop, comics, or games; at 0.65-0.75 nearly all anime (2026-09-29)

  - rkey: software-dev
    display_name: Software Dev
    description: Posts about programming and building software, picked by a topic classifier. No keyword lists.
    paths: [technology/software_dev]
    min_prob: 0.6   # 0.5-0.6 was mostly conference hashtags and engagement bait (2026-09-29)

  - rkey: tabletop
    display_name: Tabletop Games
    description: D&D and other tabletop RPGs, board games, card games, Warhammer, and miniature painting, picked by a topic classifier. No keyword lists.
    paths: [gaming/tabletop_games]
    min_prob: 0.5   # posts at 0.5-0.6 were mostly tabletop: TTRPG lore, board games, minis (2026-09-29)

  - rkey: photography
    display_name: Photography
    description: Photography, picked by a topic classifier. No keyword lists, no adult content.
    paths: [art/photography]
    min_prob: 0.5
    exclude: {adult_content: 0.2}   # ~2% of photography posts lean adult without labels (2026-09-29)

  - rkey: art
    display_name: Art
    description: Fine art, illustration, fan art, comics, and photography, picked by a topic classifier. No keyword lists, no commission ads, no adult content.
    paths: [art]
    min_prob: 0.5
    exclude: {art/commissions: 0.3, adult_content: 0.2}   # ~5% commission posts, ~1.4% suggestive (2026-09-29)
    max_posts: 10000   # ~900 posts/hour

  - rkey: calm-news
    display_name: Calm World News
    description: World news without the outrage, picked by a topic classifier. Posts the model reads as angry are left out. No keyword lists.
    paths: [world_news]
    min_prob: 0.6
    tone:
      max: {outraged: 0.3}   # ~43% of world news posts are above this (2026-09-29)
    max_posts: 10000   # ~690 posts/hour after the cutoff

  - rkey: chill-tech
    display_name: Chill Tech
    description: Technology posts (AI, software, security, gadgets) without the outrage, picked by a topic classifier. No keyword lists.
    # Tuned by Hailey in the feed builder (2026-09-29).
    paths: [technology/ai, technology/software_dev, technology/consumer_tech, technology/cybersecurity, technology/other]
    min_prob: 0.5
    exclude: {adult_content: 0.2}
    tone:
      max: {outraged: 0.35}
      weights: {humorous: 2}
    signals:
      min: {substance: 0.5}
    ranking:
      gravity: 1.2
      fresh_every: 0
      author_gap: 3
      promo_penalty: 3
    max_posts: 10000

  - rkey: funny
    display_name: Funny
    description: Jokes, puns, funny stories, and shitposts, picked by a topic classifier and a humor score. No keyword lists.
    paths: [humor]
    min_prob: 0.6
    tone:
      min: {humorous: 0.5}

  # Built for each viewer from the posts they liked (see `personal` above). Needs FEEDGEN_WELCOME_POST.
  - rkey: for-you
    display_name: For you
    description: Built for you from the posts you have liked, in the mix of topics you like. Leaves out posts you have already seen. Picked by a topic classifier. No keyword lists.
    personal: {}
