# Topic feeds served by cmd/feedgen. After adding or changing a feed, restart feedgen and
# run `make feedgen-publish` so Bluesky shows the new name and description.
#
#   rkey          record key: the last part of the feed's at:// URI (max 15 characters;
#                 changing it makes a new feed and orphans the old one)
#   display_name  shown in Bluesky (max 24 characters)
#   description   shown in Bluesky (max 300 characters)
#   paths         taxonomy subtopic paths (taxonomy/v1.yaml); a post matches when its
#                 probability for any of them is at least min_prob
#   min_prob      0-1; higher is stricter
#   allow_adult   also show posts the label policy marks adult_only (default false)
#   ranking       optional; any field left out keeps the default below
#   accepts_interactions
#                 ask Bluesky to send interactions with the feed's posts (seen, like,
#                 show more/less, ...) to table feed_interactions (default true;
#                 takes effect after `make feeds-publish`)
#
# Ranking (internal/feedgen/config.go, DefaultRanking). Each post scores
#
#   (prior + like*likes + repost*reposts + reply*replies + quote*quotes) / (age_hours + 2)^gravity
#
# with prior = max(0.1, 1 + substance + general_interest - promo_penalty*promo) from the
# model's signals, so posts with no engagement yet are still ordered sensibly. Every
# fresh_every-th slot goes to the newest post not already placed, and an author's posts
# are kept author_gap slots apart. Defaults:
#
#   ranking:
#     weights: {like: 1, repost: 2, reply: 2, quote: 3}
#     gravity: 1.8        # higher: older posts sink faster
#     fresh_every: 4      # 0: no fresh slots
#     author_gap: 10      # 0: no limit
#     promo_penalty: 1    # 0: promotional posts aren't penalized
#
# Feeds cover the last FEEDGEN_WINDOW_HOURS (48). Thresholds were
# picked from the first hour of live predictions (2026-09-29): at 0.5, NFL matched ~40
# posts/hour on a Monday night; at 0.6, AI matched ~90/hour.

feeds:
  - rkey: nfl
    display_name: NFL
    description: Posts about the NFL and American football, picked by a topic classifier. No keyword lists.
    paths: [sports/american_football]
    min_prob: 0.5

  - rkey: ai
    display_name: AI
    description: Posts about artificial intelligence (models, products, research, and the arguments about them), picked by a topic classifier. No keyword lists.
    paths: [technology/ai]
    min_prob: 0.6
