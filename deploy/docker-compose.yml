# Local services for topic-feed. Run through the Makefile (`make up`), which passes
# ~/.config/topic-feed/env as the env file so secrets never live in the repo.
name: topic-feed

services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.8.13.2  # LTS release; bump deliberately
    container_name: topic-feed-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: topicfeed
      CLICKHOUSE_USER: topicfeed
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in ~/.config/topic-feed/env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      # Bound to localhost only; nothing outside this machine needs the database.
      - "127.0.0.1:8123:8123"  # HTTP
      - "127.0.0.1:9000:9000"  # native protocol (Go client)
    volumes:
      - /data/clickhouse/data:/var/lib/clickhouse
      - /data/clickhouse/logs:/var/log/clickhouse-server
      # Backups go to the OS drive, so losing the data drive doesn't lose them too.
      - ${HOME}/backups/topic-feed/clickhouse:/backups
      # Mount the single file: mounting the whole config.d would hide the image's own
      # docker_related_config.xml, which makes the server listen beyond localhost.
      - ./clickhouse/config.d/topic-feed.xml:/etc/clickhouse-server/config.d/topic-feed.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    cap_add:
      - SYS_NICE
      - IPC_LOCK
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user topicfeed --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # Browsable labeling reports: http://<this machine>:8090/ lists every report under
  # /data/reports; each has an index.html viewer. Reachable from the internal network:
  # the only active interface is the LAN (eno1). Don't expose this machine publicly
  # without restricting this port, since reports contain post text.
  viewer:
    image: nginx:1.29-alpine
    container_name: topic-feed-viewer
    restart: unless-stopped
    ports:
      - "0.0.0.0:8090:80"
    volumes:
      - /data/reports:/usr/share/nginx/html:ro
      - ./viewer/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  # Live training charts: http://<this machine>:6006/. Shows every run under
  # /data/models (each run writes TensorBoard logs to <run>/tb). Internal network only.
  tensorboard:
    build:
      context: .
      dockerfile: tensorboard.Dockerfile
    image: topic-feed/tensorboard:local
    container_name: topic-feed-tensorboard
    restart: unless-stopped
    ports:
      - "0.0.0.0:6006:6006"
    volumes:
      - /data/models:/logs:ro

  # Jev labeling run over the labeling windows (plan §10). Only starts on request
  # (`make label`), never with a plain `make up`. Restarts on failure and resumes:
  # posts already labeled under the same taxonomy version and label_config are skipped.
  # Writes the review report to /data/reports/<version>-<label_config> when done.
  labeler:
    profiles: ["labeling"]
    build:
      context: ..
      dockerfile: deploy/go.Dockerfile
      args:
        CMD: labeler
    image: topic-feed/labeler:local
    container_name: topic-feed-labeler
    restart: on-failure:20
    # Container root maps to penguin under rootless Docker, which owns /data/reports.
    user: "0:0"
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      CLICKHOUSE_ADDR: clickhouse:9000
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:?set TYPESAFE_API_KEY in ~/.config/topic-feed/env}
      TYPESAFE_BASE_URL: https://agw.noclues.net
      JEV_MODEL: jev-1.13.0
    working_dir: /work
    volumes:
      - ../taxonomy:/work/taxonomy:ro
      - ../config:/work/config:ro
      - /data/reports:/data/reports
    command: ["-taxonomy", "taxonomy/v1.yaml", "-windows", "config/labeling_windows.yaml",
              "-report", "auto", "-batch", "1", "-max-rpm", "500"]
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "5"

  # Jetstream → ClickHouse (plan §9). First run replays INGEST_START_HOURS of history,
  # then follows live; later runs resume from the position saved in ingest_cursor.
  ingest:
    build:
      context: ..
      dockerfile: deploy/go.Dockerfile
      args:
        CMD: ingest
    image: topic-feed/ingest:local
    container_name: topic-feed-ingest
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      CLICKHOUSE_ADDR: clickhouse:9000
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      JETSTREAM_API_KEY: ${JETSTREAM_API_KEY:?set JETSTREAM_API_KEY in ~/.config/topic-feed/env}
      JETSTREAM_HOST: jetstream.us-east.bsky.network
      INGEST_START_HOURS: "72"
      METRICS_ADDR: ":9101"
    ports:
      - "127.0.0.1:9101:9101"  # Prometheus metrics
    # A shutdown lets an in-progress write finish (up to 2 minutes).
    stop_grace_period: 2m
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "5"

  # Bluesky moderation service label stream → ClickHouse mod_labels. First run starts
  # live; later runs resume from the position saved in ingest_cursor.
  modlabels:
    build:
      context: ..
      dockerfile: deploy/go.Dockerfile
      args:
        CMD: modlabels
    image: topic-feed/modlabels:local
    container_name: topic-feed-modlabels
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      CLICKHOUSE_ADDR: clickhouse:9000
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      MODLABELS_SERVICE: https://mod.bsky.app
      METRICS_ADDR: ":9102"
    ports:
      - "127.0.0.1:9102:9102"  # Prometheus metrics
    stop_grace_period: 1m
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  # Live post pipeline: ~10s after ingest, apply the label policy and find text in
  # images (tesseract, then an LLM description within a daily budget) → post_pipeline.
  # First run starts at the live edge. Edit ../config/label_policy.yaml and restart to
  # change the policy.
  pipeline:
    build:
      context: ..
      dockerfile: deploy/pipeline.Dockerfile
    image: topic-feed/pipeline:local
    container_name: topic-feed-pipeline
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      CLICKHOUSE_ADDR: clickhouse:9000
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:?set TYPESAFE_API_KEY in ~/.config/topic-feed/env}
      TYPESAFE_BASE_URL: ${TYPESAFE_BASE_URL:-https://agw.noclues.net}
      LABEL_POLICY: /config/label_policy.yaml
      PIPELINE_DELAY_SECONDS: "10"
      LLM_MODEL: gpt-6-luna:api
      LLM_DAILY_BUDGET_USD: "10"
      METRICS_ADDR: ":9103"
    volumes:
      - ../config:/config:ro
    ports:
      - "127.0.0.1:9103:9103"  # Prometheus metrics
    stop_grace_period: 1m
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"
